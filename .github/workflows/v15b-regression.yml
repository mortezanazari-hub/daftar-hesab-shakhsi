name: Validate cheque reopen regression

on:
  push:
    branches:
      - agent/transaction-details-share-v15

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/transaction-details-share-v15
          fetch-depth: 0

      - name: Apply regression patch
        run: python .v15b_patch.py

      - name: Verify patch
        run: |
          grep -F 'برگردان به جریان' app/FinanceApp.tsx
          grep -F 'assert.match(app, /برگردان به جریان/);' tests/rendered-html.test.mjs
          ! grep -F 'type GroupSettlement' app/FinanceApp.tsx

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production build
        run: npm run static:build

      - name: Run regression tests
        run: node --test tests/jalali.test.mjs tests/rendered-html.test.mjs

      - name: Commit validated product patch
        shell: bash
        run: |
          rm .v15b_patch.py .github/workflows/v15b-regression.yml
          git config user.name "Morteza Nazari"
          git config user.email "150770823+mortezanazari-hub@users.noreply.github.com"
          git add app/FinanceApp.tsx tests/rendered-html.test.mjs .v15b_patch.py .github/workflows/v15b-regression.yml
          git commit -m "Preserve cheque reopen action in transaction details"
          git push origin HEAD:agent/transaction-details-share-v15
