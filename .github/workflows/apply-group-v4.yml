name: Apply and validate group management v4

on:
  push:
    branches:
      - agent/group-edit-delete-v4

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble and verify patch
        shell: bash
        run: |
          cat .v4patch/part* > /tmp/group-v4.patch
          echo "24e64b6217e48f77b4a3e3f2db6f26f3afa8b536fc0091146219c707b9a2f031  /tmp/group-v4.patch" | sha256sum -c -
          git apply --check /tmp/group-v4.patch
          git apply /tmp/group-v4.patch

      - name: Verify exact changed files
        shell: bash
        run: |
          echo "be46cc0eb86362637becaf3efef0a01d6944e7b978da3abb791bafe7945e23aa  app/FinanceApp.tsx" | sha256sum -c -
          echo "9cea5e599e2e055cc770abe451b778658cdff17793ae423d65fc630337e2d215  app/local-db.ts" | sha256sum -c -
          echo "c0a9b39d5615e69c9eee763f26f47ea568b36390a689d197135b40832a6cfdcb  app/globals.css" | sha256sum -c -
          echo "9d0370f8ff377394157a91a5629db22c6b93de8c266349440c08fd7b12bfa136  tests/rendered-html.test.mjs" | sha256sum -c -
          echo "be13f53c1b406a44e5ca88d636bc69ea9e8381c81206ef87e3cf309c27edd13b  README.md" | sha256sum -c -

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production build
        run: npm run static:build

      - name: Run regression tests
        run: node --test tests/jalali.test.mjs tests/rendered-html.test.mjs

      - name: Commit validated source
        shell: bash
        run: |
          rm -rf .v4patch
          rm -f .github/workflows/apply-group-v4.yml
          git config user.name "Morteza Nazari"
          git config user.email "150770823+mortezanazari-hub@users.noreply.github.com"
          git add app/FinanceApp.tsx app/local-db.ts app/globals.css tests/rendered-html.test.mjs README.md
          git add -u .github/workflows .v4patch
          git commit -m "Add group editing and deletion"
          git push origin HEAD:agent/group-edit-delete-v4
