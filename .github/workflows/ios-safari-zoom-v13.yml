name: Validate iPhone Safari zoom fixes

on:
  push:
    branches:
      - agent/ios-safari-zoom-v13

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ios-safari-zoom-v13
          fetch-depth: 0

      - name: Apply iPhone Safari stability fixes
        shell: bash
        run: |
          printf '\n' >> app/globals.css
          printf '%s' '' | base64 -d >> app/globals.css
          sed -i 's/daftar-hesab-offline-v10/daftar-hesab-offline-v11/g' public/sw.js tests/rendered-html.test.mjs
          printf '\n' >> tests/rendered-html.test.mjs
          printf '%s' '' | base64 -d >> tests/rendered-html.test.mjs

      - name: Verify intended fixes
        run: |
          grep -F 'v13 — iPhone Safari zoom and horizontal-scroll stability' app/globals.css
          grep -F 'font-size: 16px !important;' app/globals.css
          grep -F 'overflow-x: clip;' app/globals.css
          grep -F 'touch-action: manipulation;' app/globals.css
          grep -F 'width: "device-width"' app/layout.tsx
          grep -F 'initialScale: 1' app/layout.tsx
          grep -F 'daftar-hesab-offline-v11' public/sw.js

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production build
        run: npm run static:build

      - name: Run regression tests
        run: node --test tests/jalali.test.mjs tests/rendered-html.test.mjs

      - name: Commit validated source
        shell: bash
        run: |
          rm .github/workflows/ios-safari-zoom-v13.yml
          git config user.name "Morteza Nazari"
          git config user.email "150770823+mortezanazari-hub@users.noreply.github.com"
          git add app/globals.css public/sw.js tests/rendered-html.test.mjs .github/workflows/ios-safari-zoom-v13.yml
          git commit -m "Stabilize iPhone Safari zoom and horizontal scrolling"
          git push origin HEAD:agent/ios-safari-zoom-v13
