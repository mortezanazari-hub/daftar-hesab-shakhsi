name: Validate linked direct settlements

on:
  push:
    branches:
      - agent/direct-entry-settlement-transactions-v18

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/direct-entry-settlement-transactions-v18
          fetch-depth: 0

      - name: Apply v18 changes
        run: python .v18_apply.py

      - name: Verify linked settlement model
        run: |
          grep -F 'operation === "settle_entry"' app/local-db.ts
          grep -F 'settlesEntryId' app/local-db.ts
          grep -F 'DirectEntrySettlementForm' app/FinanceApp.tsx
          grep -F 'تراکنش تسویه‌کننده' app/FinanceApp.tsx
          grep -F 'daftar-hesab-offline-v15' public/sw.js

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check data model
        run: npx tsc --noEmit --strict --skipLibCheck --target ES2022 --lib DOM,DOM.Iterable,ES2022 --module ESNext --moduleResolution Bundler app/local-db.ts app/jalali.ts

      - name: Production build
        run: npm run static:build

      - name: Regression tests
        run: node --test tests/jalali.test.mjs tests/rendered-html.test.mjs

      - name: Commit validated product files
        shell: bash
        run: |
          rm .v18_apply.py .github/workflows/v18-direct-settlement.yml
          git config user.name "Morteza Nazari"
          git config user.email "150770823+mortezanazari-hub@users.noreply.github.com"
          git add app/local-db.ts app/FinanceApp.tsx public/sw.js tests/rendered-html.test.mjs .v18_apply.py .github/workflows/v18-direct-settlement.yml
          git commit -m "Record direct settlements as linked transactions"
          git push origin HEAD:agent/direct-entry-settlement-transactions-v18
