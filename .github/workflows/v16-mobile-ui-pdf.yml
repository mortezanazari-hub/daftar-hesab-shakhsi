name: Validate mobile ledger and PDF reports

on:
  push:
    branches:
      - agent/fix-mobile-ledger-group-pdf-v16

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-mobile-ledger-group-pdf-v16
          fetch-depth: 0

      - name: Apply v16 patch
        run: python .v16_apply.py

      - name: Verify intended fixes
        run: |
          grep -F 'sharePersonLedgerPdf' app/FinanceApp.tsx
          grep -F 'ارسال PDF کل دفتر' app/FinanceApp.tsx
          grep -F 'ارسال PDF کامل گروه' app/FinanceApp.tsx
          grep -F '.ledger-item > .ledger-item-open' app/globals.css
          grep -F '.group-card-head > .group-title-button' app/globals.css
          grep -F 'export async function shareGroupPdf' app/report-pdf.ts
          grep -F 'daftar-hesab-offline-v14' public/sw.js

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check PDF path
        run: npx tsc --noEmit --strict --skipLibCheck --target ES2022 --lib DOM,DOM.Iterable,ES2022 --module ESNext --moduleResolution Bundler app/report-pdf.ts app/jalali.ts app/local-db.ts

      - name: Validate production build
        run: npm run static:build

      - name: Run regression tests
        run: node --test tests/jalali.test.mjs tests/rendered-html.test.mjs

      - name: Commit validated product files
        shell: bash
        run: |
          rm .v16_apply.py .github/workflows/v16-mobile-ui-pdf.yml
          git config user.name "Morteza Nazari"
          git config user.email "150770823+mortezanazari-hub@users.noreply.github.com"
          git add app/FinanceApp.tsx app/globals.css app/report-pdf.ts public/sw.js tests/rendered-html.test.mjs .v16_apply.py .github/workflows/v16-mobile-ui-pdf.yml
          git commit -m "Fix mobile ledger layouts and add PDF reports"
          git push origin HEAD:agent/fix-mobile-ledger-group-pdf-v16
