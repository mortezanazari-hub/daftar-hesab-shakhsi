name: Validate PDF visual polish

on:
  push:
    branches:
      - agent/pdf-visual-polish-v17

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pdf-visual-polish-v17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check PDF path
        run: npx tsc --noEmit --strict --skipLibCheck --target ES2022 --lib DOM,DOM.Iterable,ES2022 --module ESNext --moduleResolution Bundler app/report-pdf.ts app/jalali.ts app/local-db.ts
      - name: Production build
        run: npm run static:build
      - name: Regression tests
        run: node --test tests/jalali.test.mjs tests/rendered-html.test.mjs
