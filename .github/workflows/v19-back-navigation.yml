name: Validate Android back navigation

on:
  push:
    branches:
      - agent/android-back-navigation-v19

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/android-back-navigation-v19
          fetch-depth: 0

      - name: Apply v19 changes
        run: python .v19_apply.py

      - name: Verify browser history wiring
        run: |
          grep -F 'window.history.pushState' app/FinanceApp.tsx
          grep -F 'window.addEventListener("popstate", handlePopState)' app/FinanceApp.tsx
          grep -F 'function dismissSheet()' app/FinanceApp.tsx
          grep -F 'daftar-hesab-offline-v16' public/sw.js

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Production build
        run: npm run static:build
      - name: Regression tests
        run: node --test tests/jalali.test.mjs tests/rendered-html.test.mjs

      - name: Commit validated product files
        shell: bash
        run: |
          rm .v19_apply.py .github/workflows/v19-back-navigation.yml
          git config user.name "Morteza Nazari"
          git config user.email "150770823+mortezanazari-hub@users.noreply.github.com"
          git add app/FinanceApp.tsx public/sw.js tests/rendered-html.test.mjs
          git commit -m "Keep phone Back navigation inside the app"
          git push origin HEAD:agent/android-back-navigation-v19
