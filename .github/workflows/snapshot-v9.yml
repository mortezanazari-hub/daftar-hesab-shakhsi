name: Apply and validate due filters v9

on:
  push:
    branches:
      - agent/due-filters-share-stepper-v9

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble and apply v9 patch
        shell: bash
        run: |
          cat .v9patch/part* > /tmp/v9.patch
          git apply --check /tmp/v9.patch
          git apply /tmp/v9.patch

      - name: Verify due filters and dong controls
        shell: bash
        run: |
          grep -Fq 'useState<"current" | "next" | "all">("current")' app/FinanceApp.tsx
          grep -Fq 'hideCompletedDue' app/FinanceApp.tsx
          grep -Fq 'jalaliMonthName(currentJalaliMonth.jm)' app/FinanceApp.tsx
          grep -Fq 'calendarDueItems' app/FinanceApp.tsx
          grep -Fq 'due-completed-label' app/FinanceApp.tsx
          grep -Fq 'function ShareStepper' app/FinanceApp.tsx
          grep -Fq 'participant-share' app/FinanceApp.tsx
          grep -Fq 'checkEvents' app/local-db.ts
          grep -Fq 'operation === "transfer_check"' app/local-db.ts
          grep -Fq 'function markInstallmentPaid' app/FinanceApp.tsx
          grep -Fq 'daftar-hesab-offline-v7' public/sw.js

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production build
        run: npm run static:build

      - name: Run all regression tests
        run: node --test tests/jalali.test.mjs tests/rendered-html.test.mjs

      - name: Commit validated source
        shell: bash
        run: |
          rm -rf .v9patch
          rm -f .github/workflows/snapshot-v9.yml
          git config user.name "Morteza Nazari"
          git config user.email "150770823+mortezanazari-hub@users.noreply.github.com"
          git add app/FinanceApp.tsx app/globals.css public/sw.js tests/rendered-html.test.mjs
          git add -u .github/workflows .v9patch
          git commit -m "Improve monthly due tracking and dong share controls"
          git push origin HEAD:agent/due-filters-share-stepper-v9
