name: Validate transaction detail and receipts

on:
  push:
    branches:
      - agent/transaction-detail-receipt-polish-v20

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/transaction-detail-receipt-polish-v20
          fetch-depth: 0

      - name: Apply v20 visual changes
        run: python .v20_apply.py

      - name: Verify complete receipt sharing
        run: |
          grep -F 'shareTransactionReceipt(receipt, attachment)' app/FinanceApp.tsx
          grep -F 'const completeFiles = attachmentFile ? [receiptFile, attachmentFile] : [receiptFile]' app/transaction-share.ts
          grep -F 'transaction-evidence-card' app/globals.css
          grep -F 'daftar-hesab-offline-v17' public/sw.js

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Production build
        run: npm run static:build

      - name: Regression tests
        run: node --test tests/jalali.test.mjs tests/rendered-html.test.mjs

      - name: Commit validated product files
        shell: bash
        run: |
          rm .v20_apply.py .github/workflows/v20-transaction-detail-receipts.yml
          git config user.name "Morteza Nazari"
          git config user.email "150770823+mortezanazari-hub@users.noreply.github.com"
          git add app/FinanceApp.tsx app/transaction-share.ts app/globals.css public/sw.js tests/rendered-html.test.mjs
          git commit -m "Polish transaction details and complete receipts"
          git push origin HEAD:agent/transaction-detail-receipt-polish-v20
