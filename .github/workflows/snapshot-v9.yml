name: Capture v9 source snapshot

on:
  push:
    branches:
      - agent/due-filters-share-stepper-v9

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack source
        run: zip -r source-v9.zip app public tests README.md package.json package-lock.json vite.static.config.ts tsconfig.json
      - uses: actions/upload-artifact@v4
        with:
          name: source-v9
          path: source-v9.zip
          if-no-files-found: error
