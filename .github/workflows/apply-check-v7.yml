name: Apply and validate cheque registry v7

on:
  push:
    branches:
      - agent/check-registry-v7

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble and apply v7 patch
        shell: bash
        run: |
          cat .v7patch/part* > /tmp/check-v7.patch
          git apply --check --exclude=app/globals.css /tmp/check-v7.patch
          git apply --exclude=app/globals.css /tmp/check-v7.patch
          python - <<'PY'
          from pathlib import Path
          patch = Path('/tmp/check-v7.patch').read_text()
          section = patch.split('--- a/app/globals.css\n', 1)[1].split('--- a/app/local-db.ts\n', 1)[0]
          added = []
          for line in section.splitlines():
              if line.startswith('+++') or line.startswith('@@'):
                  continue
              if line.startswith('+'):
                  added.append(line[1:])
          css_path = Path('app/globals.css')
          css = css_path.read_text()
          marker = '/* v7 — dedicated cheque registry */'
          if marker not in css:
              css_path.write_text(css.rstrip() + '\n\n' + '\n'.join(added).strip() + '\n')
          PY

      - name: Verify cheque model and preserve previous modules
        shell: bash
        run: |
          grep -Fq 'DB_VERSION = 4' app/local-db.ts
          grep -Fq '"loanPayments", "checks"' app/local-db.ts
          grep -Fq 'operation === "add_check" || operation === "update_check"' app/local-db.ts
          grep -Fq 'operation === "update_check_status"' app/local-db.ts
          grep -Fq 'operation === "delete_check"' app/local-db.ts
          grep -Fq 'شناسه صیادی چک باید ۱۶ رقم باشد' app/local-db.ts
          grep -Fq 'finalBalance: directBalance + checkBalance + dongBalance' app/local-db.ts
          grep -Fq 'دفتر چک‌ها' app/FinanceApp.tsx
          grep -Fq 'چک گرفته‌ام' app/FinanceApp.tsx
          grep -Fq 'چک داده‌ام' app/FinanceApp.tsx
          grep -Fq 'صادرکننده / صاحب حساب' app/FinanceApp.tsx
          grep -Fq 'در وجه / ذی‌نفع فعلی' app/FinanceApp.tsx
          grep -Fq 'واگذارکننده به من' app/FinanceApp.tsx
          grep -Fq 'اگر همین بدهی/طلب را قبلاً جدا ثبت کرده‌ای' app/FinanceApp.tsx
          grep -Fq 'function chooseDirection' app/FinanceApp.tsx
          grep -Fq 'onCheck={() => openCheckForm()}' app/FinanceApp.tsx
          grep -Fq 'وام و اقساط' app/FinanceApp.tsx
          grep -Fq 'operation === "add_loan_payment"' app/local-db.ts
          grep -Fq '/* v5 — geometric icon centering */' app/globals.css
          grep -Fq '.app-icon[data-icon="calendar"]' app/globals.css
          grep -Fq '/* v7 — dedicated cheque registry */' app/globals.css
          grep -Fq 'daftar-hesab-offline-v5' public/sw.js

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production build
        run: npm run static:build

      - name: Run all regression tests
        run: node --test tests/jalali.test.mjs tests/rendered-html.test.mjs

      - name: Commit validated source
        shell: bash
        run: |
          rm -rf .v7patch
          rm -f .github/workflows/apply-check-v7.yml
          git config user.name "Morteza Nazari"
          git config user.email "150770823+mortezanazari-hub@users.noreply.github.com"
          git add README.md app/FinanceApp.tsx app/globals.css app/local-db.ts public/sw.js tests/rendered-html.test.mjs
          git add -u .github/workflows .v7patch
          git commit -m "Redesign cheque tracking and Sayad records"
          git push origin HEAD:agent/check-registry-v7
