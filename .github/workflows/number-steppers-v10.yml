name: Validate number steppers v10

on:
  push:
    branches:
      - agent/number-steppers-v10

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply numeric stepper changes
        run: python .github/number-steppers-v10.py
      - name: Verify intended controls
        run: |
          grep -Fq 'function CountStepper' app/FinanceApp.tsx
          grep -Fq 'name="installmentCount" label="تعداد اقساط" min={1} max={600}' app/FinanceApp.tsx
          grep -Fq 'name="intervalMonths" label="فاصله اقساط به ماه" min={1} max={24}' app/FinanceApp.tsx
          grep -Fq 'function ShareStepper' app/FinanceApp.tsx
          grep -Fq 'daftar-hesab-offline-v8' public/sw.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run static:build
      - run: node --test tests/jalali.test.mjs tests/rendered-html.test.mjs
      - name: Commit validated source
        run: |
          rm -f .github/workflows/number-steppers-v10.yml .github/number-steppers-v10.py
          git config user.name "Morteza Nazari"
          git config user.email "150770823+mortezanazari-hub@users.noreply.github.com"
          git add app/FinanceApp.tsx public/sw.js tests/rendered-html.test.mjs
          git add -u .github/workflows/number-steppers-v10.yml .github/number-steppers-v10.py
          git commit -m "Add steppers to small numeric fields"
          git push origin HEAD:agent/number-steppers-v10
