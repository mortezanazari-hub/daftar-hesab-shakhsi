name: Validate attachment open behavior

on:
  push:
    branches:
      - agent/open-transaction-attachments-v21

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/open-transaction-attachments-v21
          fetch-depth: 0

      - name: Apply v21 attachment behavior
        run: python .v21_apply.py

      - name: Verify attachment opens by default
        run: |
          grep -F 'openAttachment(attachment)' app/FinanceApp.tsx
          grep -F 'ارسال فایل اصلی' app/FinanceApp.tsx
          grep -F 'export async function openAttachment' app/transaction-share.ts
          grep -F 'daftar-hesab-offline-v18' public/sw.js

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Production build
        run: npm run static:build

      - name: Regression tests
        run: node --test tests/jalali.test.mjs tests/rendered-html.test.mjs

      - name: Commit validated product files
        shell: bash
        run: |
          rm .v21_apply.py .github/workflows/v21-open-attachments.yml
          git config user.name "Morteza Nazari"
          git config user.email "150770823+mortezanazari-hub@users.noreply.github.com"
          git add app/FinanceApp.tsx app/transaction-share.ts app/globals.css public/sw.js tests/rendered-html.test.mjs
          git commit -m "Open transaction attachments by default"
          git push origin HEAD:agent/open-transaction-attachments-v21
