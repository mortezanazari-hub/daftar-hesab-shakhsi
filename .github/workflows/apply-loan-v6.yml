name: Apply and validate loan installments v6

on:
  push:
    branches:
      - agent/loan-installments-v6

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble and apply v6 patch
        shell: bash
        run: |
          cat .v6patch/part* > /tmp/loan-v6.patch
          git apply --check /tmp/loan-v6.patch
          git apply /tmp/loan-v6.patch

      - name: Verify loan model, migration, calendar centering and v5 preservation
        shell: bash
        run: |
          grep -Fq 'DB_VERSION = 3' app/local-db.ts
          grep -Fq '"loans", "loanInstallments", "loanPayments"' app/local-db.ts
          grep -Fq 'operation === "add_loan" || operation === "update_loan"' app/local-db.ts
          grep -Fq 'operation === "add_loan_payment"' app/local-db.ts
          grep -Fq 'buildJalaliInstallmentDates' app/jalali.ts
          grep -Fq 'طرف حساب این بخش بانک، فروشگاه یا مؤسسه است؛ نه شخص' app/FinanceApp.tsx
          grep -Fq 'پرداخت جزئی هم مجاز است' app/FinanceApp.tsx
          grep -Fq '.app-icon[data-icon="calendar"]' app/globals.css
          grep -Fq '/* v5 — geometric icon centering */' app/globals.css
          grep -Fq 'daftar-hesab-offline-v4' public/sw.js

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production build
        run: npm run static:build

      - name: Run all regression tests
        run: node --test tests/jalali.test.mjs tests/rendered-html.test.mjs

      - name: Commit validated source
        shell: bash
        run: |
          rm -rf .v6patch
          rm -f .github/workflows/apply-loan-v6.yml
          git config user.name "Morteza Nazari"
          git config user.email "150770823+mortezanazari-hub@users.noreply.github.com"
          git add README.md app/FinanceApp.tsx app/globals.css app/jalali.ts app/local-db.ts public/sw.js tests/rendered-html.test.mjs
          git add -u .github/workflows .v6patch
          git commit -m "Redesign loans and installment tracking"
          git push origin HEAD:agent/loan-installments-v6
