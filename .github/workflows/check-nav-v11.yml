name: Validate direct cheque navigation v11

on:
  push:
    branches:
      - agent/check-nav-v11

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply direct cheque navigation
        run: python .v11/apply.py

      - name: Verify navigation update
        shell: bash
        run: |
          grep -Fq 'active={tab === "checks"} icon="check" label="چک‌ها" onClick={openChecks}' app/FinanceApp.tsx
          grep -Fq 'grid-template-columns: repeat(6, 1fr)' app/globals.css
          grep -Fq 'daftar-hesab-offline-v9' public/sw.js

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production build
        run: npm run static:build

      - name: Run regression tests
        run: node --test tests/jalali.test.mjs tests/rendered-html.test.mjs

      - name: Commit validated source
        shell: bash
        run: |
          rm -rf .v11
          rm -f .github/workflows/check-nav-v11.yml
          git config user.name "Morteza Nazari"
          git config user.email "150770823+mortezanazari-hub@users.noreply.github.com"
          git add app/FinanceApp.tsx app/globals.css public/sw.js tests/rendered-html.test.mjs
          git add -u .v11 .github/workflows/check-nav-v11.yml
          git commit -m "Make cheque management directly accessible"
          git push origin HEAD:agent/check-nav-v11
