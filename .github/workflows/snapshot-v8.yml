name: Apply and validate personal reminders v8

on:
  push:
    branches:
      - agent/personal-reminders-v8

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble and verify v8 patch
        shell: bash
        run: |
          cat .v8patch/part* > /tmp/v8.patch
          echo "578151c89a382ff7a26d2486360cca3c8159aca740716b758eb1e6ed427a61e4  /tmp/v8.patch" | sha256sum -c -
          git apply --check /tmp/v8.patch
          git apply /tmp/v8.patch

      - name: Verify personal reminder model and preserve previous modules
        shell: bash
        run: |
          grep -Fq 'DB_VERSION = 5' app/local-db.ts
          grep -Fq '"checks", "checkEvents"' app/local-db.ts
          grep -Fq 'operation === "transfer_check"' app/local-db.ts
          grep -Fq 'operation === "return_check_to_me"' app/local-db.ts
          grep -Fq 'currentHolderName' app/local-db.ts
          grep -Fq 'function markInstallmentPaid' app/FinanceApp.tsx
          grep -Fq 'پرداخت شد' app/FinanceApp.tsx
          grep -Fq 'چک‌های من' app/FinanceApp.tsx
          grep -Fq 'گرفتم، دادم، واگذار کردم' app/FinanceApp.tsx
          grep -Fq 'جزئیات و مسیر چک' app/FinanceApp.tsx
          grep -Fq 'چک رو به کی دادم؟' app/FinanceApp.tsx
          grep -Fq 'advanced-fields' app/FinanceApp.tsx
          grep -Fq 'operation === "add_loan_payment"' app/local-db.ts
          grep -Fq '/* v5 — geometric icon centering */' app/globals.css
          grep -Fq '.app-icon[data-icon="calendar"]' app/globals.css
          grep -Fq '/* v7 — dedicated cheque registry */' app/globals.css
          grep -Fq '/* v8 — personal reminders, recurring installments and cheque journey */' app/globals.css
          grep -Fq 'daftar-hesab-offline-v6' public/sw.js

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production build
        run: npm run static:build

      - name: Run all regression tests
        run: node --test tests/jalali.test.mjs tests/rendered-html.test.mjs

      - name: Commit validated source
        shell: bash
        run: |
          rm -rf .v8patch
          rm -f .github/workflows/snapshot-v8.yml
          git config user.name "Morteza Nazari"
          git config user.email "150770823+mortezanazari-hub@users.noreply.github.com"
          git add app/FinanceApp.tsx app/globals.css app/local-db.ts public/sw.js tests/rendered-html.test.mjs
          git add -u .github/workflows .v8patch
          git commit -m "Simplify recurring payments and track cheque journeys"
          git push origin HEAD:agent/personal-reminders-v8
