name: Inspect reconstructed v9 patch

on:
  push:
    branches:
      - agent/due-filters-share-stepper-v9

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble patch
        run: cat .v9patch/part* > v9-reconstructed.patch
      - uses: actions/upload-artifact@v4
        with:
          name: v9-reconstructed-patch
          path: v9-reconstructed.patch
          if-no-files-found: error
