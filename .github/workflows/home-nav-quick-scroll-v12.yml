name: Validate centered home navigation and quick scroll

on:
  push:
    branches:
      - agent/home-nav-quick-scroll-v12

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/home-nav-quick-scroll-v12
          fetch-depth: 0

      - name: Apply patch
        run: python .v12patch/apply.py

      - name: Verify intended UI changes
        run: |
          grep -F 'className="quick-grid quick-scroll"' app/FinanceApp.tsx
          grep -F 'label="خانه"' app/FinanceApp.tsx
          ! grep -F 'className="nav-add"' app/FinanceApp.tsx
          grep -F 'grid-template-columns: repeat(5, 1fr);' app/globals.css
          grep -F 'overflow-x: auto;' app/globals.css
          grep -F 'daftar-hesab-offline-v10' public/sw.js

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production build
        run: npm run static:build

      - name: Run regression tests
        run: node --test tests/jalali.test.mjs tests/rendered-html.test.mjs

      - name: Commit validated source
        run: |
          rm -rf .v12patch .github/workflows/home-nav-quick-scroll-v12.yml
          git config user.name "Morteza Nazari"
          git config user.email "150770823+mortezanazari-hub@users.noreply.github.com"
          git add app/FinanceApp.tsx app/globals.css public/sw.js tests/rendered-html.test.mjs .v12patch .github/workflows/home-nav-quick-scroll-v12.yml
          git commit -m "Center home navigation and expand quick actions"
          git push origin HEAD:agent/home-nav-quick-scroll-v12
