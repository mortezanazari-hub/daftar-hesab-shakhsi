name: Apply finance v2 patch

on:
  push:
    branches:
      - agent/dong-members-transactions-icons-v2

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dong-members-transactions-icons-v2
          fetch-depth: 0

      - name: Reassemble and verify patch
        shell: bash
        run: |
          cat .patch-v2/part-* > /tmp/finance-v2.patch
          echo "843b0fb4199bdb25f73af5bc142a65223b8f7b4534631325186d2c4af73b80a3  /tmp/finance-v2.patch" | sha256sum -c -

      - name: Normalize touched source files
        shell: bash
        run: |
          for f in \
            app/FinanceApp.tsx \
            app/globals.css \
            app/local-db.ts \
            db/index.ts \
            db/schema.ts \
            drizzle/0000_deep_masque.sql \
            tests/rendered-html.test.mjs; do
            sed -i 's/\r$//' "$f"
          done

      - name: Apply patch
        run: patch -p1 --batch < /tmp/finance-v2.patch

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate static production build
        run: npm run static:build

      - name: Run regression tests
        run: node --test tests/jalali.test.mjs tests/rendered-html.test.mjs

      - name: Commit validated source changes
        shell: bash
        run: |
          rm -rf .patch-v2
          rm -f .github/workflows/apply-v2-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/FinanceApp.tsx app/globals.css app/local-db.ts db/index.ts db/schema.ts drizzle/0000_deep_masque.sql tests/rendered-html.test.mjs .patch-v2 .github/workflows/apply-v2-patch.yml
          git commit -m "Improve dong groups, transaction details, and icons"
          git push origin HEAD:agent/dong-members-transactions-icons-v2
